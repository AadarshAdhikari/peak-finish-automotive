<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peak Finish Admin</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:1180px;margin:auto;padding:38px 20px 100px}.admin-head,.job-top,.job-actions{display:flex;justify-content:space-between;gap:12px;align-items:center}.login{max-width:480px;margin:80px auto;background:var(--panel);padding:30px;border:1px solid var(--line);border-radius:22px}.login button{margin-top:18px}.job{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}.job h3{margin:0}.job small,.muted{color:var(--muted)}.status{color:var(--gold)}.job-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.job-grid span{display:block;color:var(--muted);font-size:12px}.job-actions{justify-content:flex-start;flex-wrap:wrap}.job-actions button,.job-actions a{margin:0;text-decoration:none}.empty{text-align:center;padding:70px;color:var(--muted)}@media(max-width:700px){.job-grid{grid-template-columns:1fr}.job-top,.admin-head{align-items:flex-start;flex-direction:column}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">PF</span><span><strong>PEAK FINISH</strong><small>PRIVATE ADMIN</small></span></a><a class="header-call" href="index.html">Customer form</a></header><main class="admin"><section id="loginPanel" class="login"><span class="eyebrow">Authorised access only</span><h1>Admin sign in</h1><p class="muted">Enter an approved email address. We’ll send a secure sign-in link.</p><form id="loginForm"><label>Email<input type="email" id="loginEmail" required autocomplete="email"></label><button class="primary" type="submit">Email secure sign-in link</button><p id="loginMessage" class="muted"></p></form></section><section id="dashboard" hidden><div class="admin-head"><div><span class="eyebrow">Aadarsh & Sima</span><h1>Booking requests</h1></div><button class="secondary" id="signOut">Sign out</button></div><div id="previewNotice" class="notice" hidden><strong>Preview mode</strong><p>Connect Supabase to share bookings securely between devices.</p></div><div id="jobs"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="db.js"></script><script src="admin.js"></script></body></html>
